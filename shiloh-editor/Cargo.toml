[package]
name = "shiloh-editor"
description = "Scene editor and project management for Shiloh3D"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
ahash.workspace = true
anyhow.workspace = true
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
glam.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shiloh-app = { workspace = true }
shiloh-assets = { workspace = true }
shiloh-core = { workspace = true }
shiloh-ecs = { workspace = true }
shiloh-scene = { workspace = true }
thiserror.workspace = true
tracing.workspace = true

[features]
default = ["ui"]
ui = ["dep:egui", "dep:eframe"]

[[bin]]
name = "shiloh-editor"
path = "src/bin/shiloh-editor.rs"
required-features = ["ui"]

[lints]
workspace = true
