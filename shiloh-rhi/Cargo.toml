[package]
name = "shiloh-rhi"
description = "Render hardware interface — native-first GPU backends (Vulkan/D3D12/Metal), wgpu extension, WebGL"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
ahash.workspace = true
bitflags.workspace = true
bytemuck.workspace = true
glam.workspace = true
parking_lot.workspace = true
shiloh-core = { workspace = true }
thiserror.workspace = true
tracing.workspace = true
# Extension path (desktop + WebGPU). Native primary backends land separately.
wgpu = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }

[features]
default = []
# Primary shipping path — platform native APIs (stubs until wired).
native = []
# Extension: portable wgpu (also WebGPU in browsers).
wgpu = ["dep:wgpu", "dep:raw-window-handle"]
# Browser reach path.
webgl = []
# Browser matrix helper.
web = ["webgl", "wgpu"]

[lints]
workspace = true
